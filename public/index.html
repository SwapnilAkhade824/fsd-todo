<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>To-Do List</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="todo-container">
      <header class="todo-header">
        <h1>To-Do</h1>
      </header>

      <div class="todo-actions">
        <button type="button" class="btn btn-primary" id="new-task-btn">
          <span class="plus-icon">+</span> New Task
        </button>
      </div>

      <p id="app-status" role="status" aria-live="polite" hidden></p>

      <main class="task-list" id="task-list"></main>
    </div>

    <dialog id="task-dialog" class="task-dialog" aria-labelledby="dialog-title">
      <form id="task-form" class="task-form" novalidate>
        <h2 id="dialog-title">New Task</h2>

        <label for="task-input">Task</label>
        <input
          type="text"
          id="task-input"
          maxlength="200"
          autocomplete="off"
          placeholder="What needs to be done?"
          required
        />

        <label for="due-input">Due date (optional)</label>
        <input type="date" id="due-input" autocomplete="off" />

        <label for="tag-input">Tag (optional)</label>
        <div class="tag-field">
          <input
            type="text"
            id="tag-input"
            maxlength="50"
            autocomplete="off"
            placeholder="e.g. Work, Personal"
            aria-autocomplete="list"
            aria-controls="tag-dropdown"
            aria-expanded="false"
          />
          <ul id="tag-dropdown" class="tag-dropdown" role="listbox" hidden></ul>
        </div>

        <p class="form-error" id="form-error" role="alert" hidden></p>

        <div class="dialog-actions">
          <button type="button" id="cancel-btn">Cancel</button>
          <button type="submit" class="save-btn" id="save-btn">Add Task</button>
        </div>
      </form>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
